<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>MiniAppHub</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  #boot-error{position:fixed;inset:auto 0 0 0;margin:0;padding:14px 18px;background:var(--surface);
    border-top:1px solid var(--line);color:var(--muted);font-size:13px}
</style>
</head>
<body>
<iframe id="app" sandbox="allow-scripts allow-forms allow-downloads allow-popups" title="mini-app"></iframe>
<p id="boot-error" hidden></p>
<script type="module" src="core/runtime.js"></script>
</body>
</html>
